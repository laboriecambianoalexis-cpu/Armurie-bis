<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Barillet de revolver (6 chambres) — sert de forme au logo « liquid metal » -->
  <defs>
    <mask id="holes">
      <rect width="512" height="512" fill="#fff"/>
      <g fill="#000">
        <circle cx="256" cy="126" r="46"/>
        <circle cx="368.6" cy="191" r="46"/>
        <circle cx="368.6" cy="321" r="46"/>
        <circle cx="256" cy="386" r="46"/>
        <circle cx="143.4" cy="321" r="46"/>
        <circle cx="143.4" cy="191" r="46"/>
        <circle cx="256" cy="256" r="22"/>
      </g>
      <!-- cannelures entre les chambres -->
      <g fill="#000">
        <ellipse cx="256" cy="20" rx="30" ry="34" transform="rotate(30 256 256)"/>
        <ellipse cx="256" cy="20" rx="30" ry="34" transform="rotate(90 256 256)"/>
        <ellipse cx="256" cy="20" rx="30" ry="34" transform="rotate(150 256 256)"/>
        <ellipse cx="256" cy="20" rx="30" ry="34" transform="rotate(210 256 256)"/>
        <ellipse cx="256" cy="20" rx="30" ry="34" transform="rotate(270 256 256)"/>
        <ellipse cx="256" cy="20" rx="30" ry="34" transform="rotate(330 256 256)"/>
      </g>
    </mask>
  </defs>
  <circle cx="256" cy="256" r="228" fill="#000" mask="url(#holes)"/>
</svg>
